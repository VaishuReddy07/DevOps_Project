name: Vaishnavi DevOps CI Pipeline

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project Source
        uses: actions/checkout@v4

      - name: Setup Python 3.9 Environment
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Verify Flask Project Structure
        run: |
          pwd
          find . -type f

      - name: Install Flask Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Code Quality
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # New Step: Log into Docker Hub so you have permission to push the image
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Updated Step: Build AND Push the image using the unique GitHub SHA tag
      - name: Build and Push Docker Image
        run: |
          docker build -t vaishnaviputta/devops-project:${{ github.sha }} .
          docker push vaishnaviputta/devops-project:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # Navigate to where your application files live
            cd ~/app
            echo "TAG=${{ github.sha }}" > .env
            
            # Dynamically update the image tag in your docker-compose file
            sed -i "s|image: vaishnaviputta/devops-project:.*|image: vaishnaviputta/devops-project:${{ github.sha }}|g" docker-compose.yml
            
            # Pull the newly pushed image from Docker Hub and restart the containers
            docker compose pull
            docker compose down
            docker compose up -d